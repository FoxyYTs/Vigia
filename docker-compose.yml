# Ver Vigia-UML-Despliegue (vault de Obsidian) para el diagrama completo.
# 7 servicios: nginx, backend (Gunicorn), celery-worker, celery-beat,
# redis, db (PostgreSQL+PostGIS), cloudflared. El bot de Telegram y el
# modelo de recurrencia corren dentro de celery-worker, no como servicios
# propios.

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vigia}
      POSTGRES_USER: ${POSTGRES_USER:-vigia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigia}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/production.txt
    restart: unless-stopped
    # migrate + collectstatic solo aquí, no en celery-worker/celery-beat —
    # correrlo desde 3 contenedores a la vez en el primer arranque
    # provocaría una carrera sobre las mismas migraciones.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media

  celery-worker:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/production.txt
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_files:/app/media

  celery-beat:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/production.txt
    restart: unless-stopped
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build: ./nginx
    restart: unless-stopped
    # Solo accesible en localhost — cloudflared llega por la red interna
    # de Docker (nginx:80), no por este puerto. Publicado en 127.0.0.1
    # únicamente para poder probar sin pasar por el túnel durante
    # desarrollo local.
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    volumes:
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?falta CLOUDFLARE_TUNNEL_TOKEN en .env}
    depends_on:
      - nginx

volumes:
  postgres_data:
  static_files:
  media_files:
