# Ver Vigia-UML-Despliegue (vault de Obsidian) para el diagrama completo.
# 7 servicios: nginx, backend (Gunicorn), celery-worker, celery-beat,
# redis, db (PostgreSQL+PostGIS), cloudflared. El bot de Telegram y el
# modelo de recurrencia corren dentro de celery-worker, no como servicios
# propios.

# Logs acotados: con el driver json-file por defecto crecen sin límite en el
# servidor (celery-worker registra en info cada sincronización).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *logging
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vigia}
      POSTGRES_USER: ${POSTGRES_USER:-vigia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigia}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    logging: *logging
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    logging: *logging
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/production.txt
    restart: unless-stopped
    # migrate + collectstatic solo aquí, no en celery-worker/celery-beat —
    # correrlo desde 3 contenedores a la vez en el primer arranque
    # provocaría una carrera sobre las mismas migraciones.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 90"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    # Gunicorn respondiendo de verdad (no solo el contenedor arriba); nginx
    # espera a que esté sano. start_period cubre migrate + collectstatic.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/focos/ultimo/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  celery-worker:
    logging: *logging
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/production.txt
    restart: unless-stopped
    # Dos procesos: el reentrenamiento usa ~1,2 GB y el servidor es compartido.
    # max-tasks-per-child libera la memoria que pandas/sklearn no devuelven.
    command: celery -A config worker --loglevel=info --concurrency 2 --max-tasks-per-child 50
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_files:/app/media

  celery-beat:
    logging: *logging
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/production.txt
    restart: unless-stopped
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    logging: *logging
    build: ./nginx
    restart: unless-stopped
    # Solo accesible en localhost — cloudflared llega por la red interna
    # de Docker (nginx:80), no por este puerto. Publicado en 127.0.0.1
    # únicamente para probar sin pasar por el túnel. Si el 8080 está
    # ocupado en el equipo, cambiar NGINX_PUERTO (ver DESPLIEGUE.md).
    ports:
      - "${NGINX_PUERTO:-127.0.0.1:8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      # Flutter Web: se monta app/ completa (existe siempre en el repo) y
      # Nginx sirve app/build/web. Montar directamente app/build/web haría
      # que Docker la creara vacía y con dueño root si aún no hay build.
      # Mismo origen que /api, así que no hace falta CORS.
      - ./app:/srv/app:ro

  cloudflared:
    logging: *logging
    image: cloudflare/cloudflared:2025.11.1
    restart: unless-stopped
    # Solo arranca con COMPOSE_PROFILES=publico (el servidor). Si el portátil
    # también corriera este túnel, Cloudflare repartiría el tráfico de
    # vigia.foxyyts.qzz.io entre los dos.
    profiles: ["publico"]
    # El token va por variable de entorno y no en `command`: así no aparece en
    # `ps` ni en `docker inspect … Args`.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx

volumes:
  postgres_data:
  static_files:
  media_files:
