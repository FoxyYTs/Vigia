# Ver Vigia-UML-Despliegue (vault de Obsidian): un solo dominio, este Nginx
# hace de reverse proxy hacia Gunicorn para /api y sirve directamente el
# build estático de Flutter Web para todo lo demás.

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;  # fotos de ReporteCiudadano

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # Flutter Web (build estático) — pendiente hasta que exista app/build/web
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
