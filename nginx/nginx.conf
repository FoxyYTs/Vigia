# Ver Vigia-UML-Despliegue (vault de Obsidian): un solo dominio, este Nginx
# hace de reverse proxy hacia Gunicorn para /api y sirve directamente el
# build estático de Flutter Web para todo lo demás.

# Límite de intentos en Nginx para login, registro y /admin/ (además del de
# DRF, que no cubre el login del admin de Django). Por IP real del cliente.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # IP real del cliente: Cloudflare la manda en CF-Connecting-IP y solo se le
    # cree a cloudflared (red interna de Docker), no a una cabecera del cliente.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    resolver 127.0.0.11 valid=10s ipv6=off;  # DNS interno de Docker
    set $backend backend:8000;

    client_max_body_size 10M;  # fotos de ReporteCiudadano

    # El GeoJSON de municipios (~1 MB) y las zonas del modelo comprimen ~5×.
    gzip on;
    gzip_proxied any;
    gzip_types application/json application/geo+json application/javascript text/css;

    # Cabeceras de seguridad (OWASP A05).
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # CSP completa (#35). Orígenes externos: canvaskit y fuentes de Flutter
    # (gstatic), teselas de OpenStreetMap y Google Analytics (solo se carga si
    # la persona acepta, ver app/web/consentimiento.js). 'wasm-unsafe-eval' lo
    # exige el WebAssembly de canvaskit; 'unsafe-inline' en estilos, los <style>
    # que inserta Flutter. Sin 'unsafe-inline' en scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://www.googletagmanager.com https://*.google-analytics.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /api/ {
        include /etc/nginx/snippets/proxy_django.conf;
    }

    location ~ ^/api/auth/(token|registro|logout)/$ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/proxy_django.conf;
    }

    location /admin/ {
        limit_req zone=auth burst=20 nodelay;
        include /etc/nginx/snippets/proxy_django.conf;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    # Las fotos de reportes no son públicas (Ley 1581): no hay `location /media/`.
    # Django comprueba el permiso en /api/reportes/{id}/foto/ y responde con
    # X-Accel-Redirect hacia esta ruta, que solo Nginx puede usar (`internal`).
    location /protegido/media/ {
        internal;
        alias /app/media/;
        # Repetidas aquí porque un add_header dentro del location anula los del server.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cache-Control "private, max-age=3600" always;
    }

    # Flutter Web: docker-compose.yml monta la carpeta app/ (siempre existe
    # en el repo) y aquí se sirve su build, app/build/web. Las rutas que no
    # son archivos devuelven index.html (la app enruta con #/...).
    # Si todavía no se corrió `flutter build web`, no hay index.html y se
    # responde 503 con una página que lo explica, sin ciclos de redirección.
    location / {
        root /srv/app/build/web;
        try_files $uri /index.html @sin_build;
        # Los archivos de Flutter Web no llevan hash en el nombre (main.dart.js),
        # así que sin esto Cloudflare y el navegador servían el build viejo
        # hasta 4 h. no-cache = revalidar con el ETag (un 304 si no cambió).
        # `expires` y no `add_header`, que anularía las cabeceras del server.
        expires -1;
    }

    location @sin_build {
        return 503;
    }

    error_page 503 /sin-build.html;
    location = /sin-build.html {
        root /usr/share/nginx/html;
        internal;
    }
}
