# Ver Vigia-UML-Despliegue (vault de Obsidian): un solo dominio, este Nginx
# hace de reverse proxy hacia Gunicorn para /api y sirve directamente el
# build estático de Flutter Web para todo lo demás.

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;  # fotos de ReporteCiudadano

    # Cabeceras de seguridad básicas (OWASP A05). La CSP completa (scripts,
    # wasm de Flutter, teselas de OSM) queda pendiente: por ahora solo se
    # prohíbe embeber el sitio en iframes de otros orígenes.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        # Sin URI después del host: Nginx reenvía la ruta completa (/api/...),
        # que es donde Django monta las URLs (config/urls.py). Con "/" al
        # final se recortaba el prefijo y toda la API respondía 404.
        proxy_pass http://backend:8000;
        # Django ya manda algunas de estas cabeceras; se ocultan las suyas
        # para que el navegador reciba un solo valor (el de arriba).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare Tunnel ya marca la conexión original como https antes
        # de llegar aquí — Nginx nunca termina TLS (solo escucha HTTP puro,
        # $scheme siempre sería "http"). Reenviar el header tal como llega
        # en vez de reconstruirlo, o SECURE_PROXY_SSL_HEADER en Django
        # pensaría que ninguna conexión es segura.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        # Django ya manda algunas de estas cabeceras; se ocultan las suyas
        # para que el navegador reciba un solo valor (el de arriba).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare Tunnel ya marca la conexión original como https antes
        # de llegar aquí — Nginx nunca termina TLS (solo escucha HTTP puro,
        # $scheme siempre sería "http"). Reenviar el header tal como llega
        # en vez de reconstruirlo, o SECURE_PROXY_SSL_HEADER en Django
        # pensaría que ninguna conexión es segura.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # Flutter Web: docker-compose.yml monta la carpeta app/ (siempre existe
    # en el repo) y aquí se sirve su build, app/build/web. Las rutas que no
    # son archivos devuelven index.html (la app enruta con #/...).
    # Si todavía no se corrió `flutter build web`, no hay index.html y se
    # responde 503 con una página que lo explica, sin ciclos de redirección.
    location / {
        root /srv/app/build/web;
        try_files $uri /index.html @sin_build;
    }

    location @sin_build {
        return 503;
    }

    error_page 503 /sin-build.html;
    location = /sin-build.html {
        root /usr/share/nginx/html;
        internal;
    }
}
