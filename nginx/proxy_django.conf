# Proxy hacia Gunicorn, compartido por /api/, /api/auth/ y /admin/ (ver nginx.conf).
# Con una variable en proxy_pass Nginx resuelve el nombre en cada petición (con
# `resolver`) y no se queda con la IP vieja cuando se recrea el contenedor
# backend (antes respondía 502 hasta reiniciar Nginx). Se reenvía la ruta completa.
proxy_pass http://$backend;
# Django ya manda algunas de estas cabeceras; se ocultan las suyas para que el
# navegador reciba un solo valor (el de nginx.conf).
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# $remote_addr ya es la IP real del cliente (real_ip_header CF-Connecting-IP).
# Se reemplaza, no se agrega: un X-Forwarded-For enviado por el cliente no debe
# llegar a Django, o cada valor inventado contaría como una IP distinta para el
# límite de intentos (DRF usa NUM_PROXIES=1).
proxy_set_header X-Forwarded-For $remote_addr;
# Cloudflare Tunnel ya marca la conexión original como https antes de llegar
# aquí; Nginx solo escucha HTTP, así que se reenvía la cabecera tal como llega.
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
