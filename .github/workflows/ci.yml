# Pruebas en cada PR y en cada push a develop/main: backend (pytest + ruff con
# PostGIS real) y app (flutter analyze + flutter test).
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# Un push nuevo a la misma rama o PR cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: vigia
          POSTGRES_USER: vigia
          POSTGRES_PASSWORD: solo-para-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vigia" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgis://vigia:solo-para-ci@localhost:5432/vigia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: GDAL/GEOS para django.contrib.gis
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin
      - name: Dependencias
        run: pip install -r requirements/local.txt
      - name: Clave secreta aleatoria (el backend rechaza las débiles)
        run: echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
      - name: ruff
        run: python -m ruff check .
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
      - name: pytest
        # --durations: las pruebas más lentas, para saber dónde se va el tiempo.
        run: python -m pytest -p no:cacheprovider --durations=15

  # La imagen de producción instala requirements/production.txt, no local.txt:
  # en la v0.4.5 faltaba una dependencia que solo traían las de pruebas y se
  # rompió únicamente en producción.
  imagen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen de producción
        run: docker build --build-arg REQUIREMENTS_FILE=requirements/production.txt -t vigia-backend backend
      - name: Importa Django, Celery y pasa check --deploy
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=config.settings.production \
            -e DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            -e DJANGO_ALLOWED_HOSTS=vigia.example.org \
            -e DATABASE_URL=postgis://x:y@localhost:5432/z \
            vigia-backend sh -c "python -c 'import config.celery' && python manage.py check --deploy --fail-level ERROR"

  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
